<!DOCTYPE html>
<html lang="en">
<head><title>Othoba — Electronics (hydrated)</title></head>
<body>
  <!-- JS-hydrated listing as Playwright's page.content() would deliver it.
       Locks the "176 Sold" counter and "৳x/month" EMI poison guards. -->
  <main>
    <div class="product-list">
      <div class="product-item" data-product-id="9001">
        <a href="https://www.othoba.test/samsung-galaxy-a07">
          <img src="https://www.othoba.test/img/a07.jpg" alt="Samsung Galaxy A07">
        </a>
        <h4 class="product-title">Samsung Galaxy A07 (4/64GB)</h4>
        <div class="product-price">
          <span class="price">৳16,399</span>
          <span class="sold">176 Sold</span>
        </div>
        <span class="emi-price">৳1,367/month</span>
      </div>
      <div class="product-item" data-product-id="9002">
        <a href="https://www.othoba.test/xiaomi-tv-a43">
          <img src="https://www.othoba.test/img/tv43.jpg" alt="Xiaomi TV A 43">
        </a>
        <h4 class="product-title">Xiaomi TV A 43 Inch FHD Smart LED</h4>
        <div class="product-price">
          <span class="old-price">৳38,500</span>
          <span class="price">৳34,999</span>
          <span class="sold">52 Sold</span>
        </div>
        <span class="emi-price">৳2,917/month</span>
      </div>
      <!-- bare-numeric path: currency symbol lives in its own sibling -->
      <div class="product-item" data-product-id="9003">
        <a href="https://www.othoba.test/whirlpool-fridge-260l">
          <img src="https://www.othoba.test/img/fridge.jpg" alt="Whirlpool Fridge 260L">
        </a>
        <h4 class="product-title">Whirlpool Refrigerator 260 Litre</h4>
        <div class="product-price">
          <span class="currency">৳</span><span class="amount">42,500</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
