<!DOCTYPE html>
<html lang="en">
<head><title>Daraz — Flash Sale</title></head>
<body>
  <!-- load-more flash listing: every card carries original + discount so the
       "all rows have originalPrice" regression can never come back -->
  <main>
    <div class="flash-sale-list">
      <div class="product-card" data-product-id="101">
        <a href="https://www.daraz.test/products/i101.html">
          <img src="https://img.daraz.test/1.jpg" alt="iPhone 15 Pro Max Case">
        </a>
        <h3 class="title">iPhone 15 Pro Max Silicone Case</h3>
        <span class="price">৳450</span>
        <span class="origin-price" style="text-decoration: line-through;">৳900</span>
        <span class="discount-badge">-50%</span>
      </div>
      <div class="product-card" data-product-id="102">
        <a href="https://www.daraz.test/products/i102.html">
          <img src="https://img.daraz.test/2.jpg" alt="Wireless Earbuds Pro">
        </a>
        <h3 class="title">TWS Wireless Earbuds Pro ANC</h3>
        <span class="price">৳1,299</span>
        <span class="origin-price">৳2,599</span>
        <span class="discount-badge">-50%</span>
      </div>
      <div class="product-card" data-product-id="103">
        <a href="https://www.daraz.test/products/i103.html">
          <img src="https://img.daraz.test/3.jpg" alt="Smart Watch Ultra">
        </a>
        <h3 class="title">S9 Ultra Smart Watch Series 9</h3>
        <span class="price">৳1,850</span>
        <span style="text-decoration: line-through;">৳3,700</span>
        <span class="discount-badge">-50%</span>
      </div>
    </div>
    <button class="J_LoadMore">Load More</button>
  </main>
</body>
</html>
